[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal crates (layered; a crate may only depend on crates below it)
protocol = { path = "crates/protocol" }
link = { path = "crates/link" }
controller = { path = "crates/controller" }
machine = { path = "crates/machine" }
program = { path = "crates/program" }
runner = { path = "crates/runner" }
sim = { path = "crates/sim" }
route = { path = "crates/route" }
nest = { path = "crates/nest" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
thiserror = "2"
ctrlc = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

# The browser's WebAssembly module (solvers): one optimised unit, no unwinding, no symbols.
# cargo build -p solvers --target wasm32-unknown-unknown --profile wasm
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true
