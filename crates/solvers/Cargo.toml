[package]
name = "solvers"
description = "The route optimiser and the nester, exported to WebAssembly for the browser: one module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for the browser; rlib for the examples and the station.
crate-type = ["cdylib", "rlib"]

[dependencies]
route.workspace = true
nest.workspace = true

# Its own lints: the workspace forbids unsafe code, and exporting functions to WebAssembly
# needs a little, allowed item by item below.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
