[package]
name = "link"
description = "Byte transport to the controller: serial port, simulator, capture replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["serial"]
serial = ["dep:serialport", "dep:nix"]

[dependencies]
serialport = { workspace = true, optional = true }
thiserror.workspace = true

# The speed set again through termios (serial.rs `set_speed`); the version serialport uses.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.26", default-features = false, features = ["term"], optional = true }

[dev-dependencies]
protocol.workspace = true

[lints]
workspace = true
